<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>声の確認ページ</title>
<style>
  body { margin: 0; padding: 16px; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; color: #24382c; background: #f5f2ea; line-height: 1.6; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  .box { background: #fff; border: 1px solid #d8d4c8; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 0.95rem; }
  .box p { margin: 0 0 4px; }
  .rate { display: flex; gap: 8px; margin-top: 8px; }
  .rate button { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #5c7a63; border-radius: 8px; background: #fff; color: #24382c; }
  .rate button[aria-pressed="true"] { background: #5c7a63; color: #fff; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: 8px; }
  .voice { width: 100%; text-align: left; padding: 12px 14px; font-size: 1rem; color: #24382c; background: #fff; border: 1px solid #d8d4c8; border-radius: 10px; }
  .voice.picked { border: 2px solid #c0392b; }
  .voice.playing { background: #fff3c4; }
  .voice small { display: block; color: #5c7a63; word-break: break-all; }
  .tag { color: #c0392b; font-weight: 700; }
</style>
</head>
<body>

<h1>声の確認ページ</h1>

<div class="box">
  <p>声の名前を押すと、その声で英文を読みます。<b>人の声に近いと感じた番号</b>を教えてください。</p>
  <p>赤い枠が、今サイトで使っている声です。</p>
  <div class="rate" role="group" aria-label="読む速さ">
    <button type="button" data-rate="0.85">サイトの速さ（0.85）</button>
    <button type="button" data-rate="1">ふつうの速さ（1.0）</button>
  </div>
</div>

<div class="box" id="info" aria-live="polite"></div>

<ol id="list"></ol>

<script>
  var SENTENCE = 'Grandpa smiled and said, "See? You know English."';
  var synth = window.speechSynthesis;
  var rate = 0.85;
  var eventFired = false;
  var playingBtn = null;

  // story.js の pickVoice と同じ選び方
  function pickVoice(voices) {
    var odd = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Junior|Kathy|Princess|Ralph|Fred|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b|eloquence|speech\.synthesis/i;
    var all = voices.filter(function (v) { return /^en[-_]/i.test(v.lang) && !odd.test(v.name + ' ' + v.voiceURI); });
    var us = all.filter(function (v) { return /en[-_]US/i.test(v.lang); });
    var good = function (v) { return /Google|Natural|Online|Premium|Enhanced/i.test(v.name); };
    var samantha = function (v) { return /Samantha/i.test(v.name); };
    return us.filter(good)[0] || all.filter(good)[0] || us.filter(samantha)[0] || us[0] || all[0] || null;
  }

  function speak(voice, btn) {
    var u = new SpeechSynthesisUtterance(SENTENCE);
    u.lang = voice.lang;
    u.voice = voice;
    u.rate = rate;
    u.onend = u.onerror = function () { btn.classList.remove('playing'); };
    if (playingBtn) playingBtn.classList.remove('playing');
    playingBtn = btn;
    btn.classList.add('playing');
    synth.speak(u);
  }

  function draw() {
    var voices = synth.getVoices();
    var english = voices.filter(function (v) { return /^en[-_]/i.test(v.lang); });
    var picked = pickVoice(voices);
    var list = document.getElementById('list');
    list.innerHTML = '';
    english.forEach(function (v, i) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'voice' + (v === picked ? ' picked' : '');
      btn.appendChild(document.createTextNode((i + 1) + '. ' + v.name + ' '));
      if (v === picked) {
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = '← サイトの声';
        btn.appendChild(tag);
      }
      var small = document.createElement('small');
      small.textContent = v.lang + ' / ' + v.voiceURI;
      btn.appendChild(small);
      btn.addEventListener('click', function () {
        if (synth.speaking || synth.pending) {
          synth.cancel();
          setTimeout(function () { speak(v, btn); }, 80);
        } else {
          speak(v, btn);
        }
      });
      li.appendChild(btn);
      list.appendChild(li);
    });
    drawInfo(voices.length, english.length, picked);
  }

  var storyState = '確認中';
  function drawInfo(total, english, picked) {
    var info = document.getElementById('info');
    info.innerHTML = '';
    [
      '声の数：全部 ' + total + '／英語 ' + english,
      'サイトの声：' + (picked ? picked.name : '（見つからない・端末まかせ）'),
      '読み込みの知らせ：' + (eventFired ? 'あり' : 'なし'),
      'story.js：' + storyState,
      '端末：' + navigator.userAgent
    ].forEach(function (text) {
      var p = document.createElement('p');
      p.textContent = text;
      info.appendChild(p);
    });
  }

  document.querySelectorAll('[data-rate]').forEach(function (b) {
    b.setAttribute('aria-pressed', Number(b.dataset.rate) === rate);
    b.addEventListener('click', function () {
      rate = Number(b.dataset.rate);
      document.querySelectorAll('[data-rate]').forEach(function (o) {
        o.setAttribute('aria-pressed', o === b);
      });
    });
  });

  if (!synth || !window.SpeechSynthesisUtterance) {
    document.getElementById('info').textContent = 'このブラウザでは音声が使えません。';
  } else {
    if (synth.addEventListener) synth.addEventListener('voiceschanged', function () { eventFired = true; draw(); });
    draw();
    // 知らせが来ない端末のために、少しの間ようすを見る（押している最中に作り直さないよう、声の数が変わったときだけ）
    var lastCount = synth.getVoices().length, tries = 0;
    var poll = setInterval(function () {
      tries++;
      if (synth.getVoices().length !== lastCount) { lastCount = synth.getVoices().length; draw(); }
      if (tries >= 10) clearInterval(poll);
    }, 500);

    // この端末が新しい story.js を読んでいるか（いつもの読み込みと同じキャッシュを使う）
    fetch('story.js').then(function (r) { return r.text(); }).then(function (t) {
      storyState = t.indexOf('Samantha') >= 0 ? '新しい版' : '古い版';
      draw();
    }).catch(function () { storyState = '確認できず'; draw(); });
  }
</script>

</body>
</html>
